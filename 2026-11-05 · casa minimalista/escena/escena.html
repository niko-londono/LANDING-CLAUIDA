     pintar(p): coloca la cámara en el recorrido (exterior → puerta → salón → cocina → dormitorio → ventanal) y renderiza una vez.
     Adaptable: horizontal 1920×1080 y vertical 1080×1920 (lee el tamaño de la ventana). Sin texto: los textos van en el HTML de la web. -->

<script type="module">
  import * as THREE from "three";
  import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
  import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
  const { tramo, mezclar, E, ruido } = U;

  // ───────── Render ─────────
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.55;
  scene.fog = new THREE.Fog("#efdcc8", 45, 160);
  const camara = new THREE.PerspectiveCamera(48, 16 / 9, 0.08, 400);

  // ───────── Paleta ─────────
  const C = {
    enlucido: "#f2ede5", techo: "#f6f2ec", roble: "#c9a47c", robleOscuro: "#a9825b", lino: "#e7ded1", linoOsc: "#d6c8b4",
    hormigon: "#d8d2c9", piedra: "#eeeae3", negro: "#262421", salvia: "#9aa58a", salviaOsc: "#6f7d5e", cesped: "#a8b08c",
    terracota: "#c99a7c", crema: "#f4ecdf",
  };
  const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, ...o });

  // ───────── Texturas procedurales (deterministas) ─────────
  function lienzo(w, h, dibujar) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    dibujar(c.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
    return t;
  }
  // Tarima de roble claro: tablas a lo largo de z
  const texTarima = lienzo(1024, 1024, (g, w, h) => {
    const n = 8, a = w / n;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < 3; j++) {
        const y0 = ((j + ruido(i, 4)) / 3) * h;
        const tono = 196 + Math.round((ruido(i * 7 + j, 2) - 0.5) * 18);
        g.fillStyle = `rgb(${tono},${tono - 34},${tono - 78})`;
        g.fillRect(i * a, y0 - h, a, h); g.fillRect(i * a, y0, a, h);
        g.fillStyle = "rgba(90,60,30,.18)"; g.fillRect(i * a, y0, a, 2);
      }
      g.fillStyle = "rgba(90,60,30,.22)"; g.fillRect(i * a, 0, 2, h);
      for (let k = 0; k < 6; k++) { // vetas suaves
        g.fillStyle = "rgba(120,80,40,.05)";
        g.fillRect(i * a + ruido(i * 13 + k, 6) * a, 0, 1 + ruido(k, i) * 3, h);
      }
    }
  });
  texTarima.repeat.set(11, 7);
  // Listones verticales de madera (fachada y armario)
  const texListones = lienzo(512, 64, (g, w, h) => {
    const n = 16, a = w / n;
    for (let i = 0; i < n; i++) {
      const tono = 186 + Math.round((ruido(i, 9) - 0.5) * 16);
      g.fillStyle = `rgb(${tono},${tono - 40},${tono - 84})`; g.fillRect(i * a, 0, a, h);
      g.fillStyle = "rgba(60,40,20,.45)"; g.fillRect(i * a, 0, 3, h);
    }
  });
  // Cuadro abstracto
  const texCuadro = lienzo(600, 800, (g, w, h) => {
    g.fillStyle = "#efe6d8"; g.fillRect(0, 0, w, h);
    g.fillStyle = C.terracota; g.beginPath(); g.arc(w * 0.42, h * 0.42, w * 0.24, 0, Math.PI * 2); g.fill();
    g.strokeStyle = C.salviaOsc; g.lineWidth = 26; g.beginPath(); g.arc(w * 0.6, h * 0.72, w * 0.3, Math.PI, Math.PI * 2); g.stroke();
    g.fillStyle = "#2f2b27"; g.fillRect(w * 0.18, h * 0.86, w * 0.64, 6);
  });
  const texCuadro2 = lienzo(800, 500, (g, w, h) => {
    g.fillStyle = "#ece4d7"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#d9c7b0"; g.fillRect(0, h * 0.62, w, h * 0.38);
    g.fillStyle = C.salvia; g.beginPath(); g.ellipse(w * 0.3, h * 0.62, w * 0.22, h * 0.25, 0, Math.PI, 0); g.fill();
    g.fillStyle = C.terracota; g.beginPath(); g.arc(w * 0.72, h * 0.32, h * 0.12, 0, Math.PI * 2); g.fill();
  });

  const M = {
    enlucido: mat(C.enlucido, { roughness: 0.95 }), techo: mat(C.techo, { roughness: 1 }),
    roble: mat(C.roble, { roughness: 0.6 }), robleOsc: mat(C.robleOscuro, { roughness: 0.6 }),
    lino: mat(C.lino, { roughness: 1 }), linoOsc: mat(C.linoOsc, { roughness: 1 }),
    hormigon: mat(C.hormigon, { roughness: 0.92 }), piedra: mat(C.piedra, { roughness: 0.35 }),
    negro: mat(C.negro, { roughness: 0.55, metalness: 0.2 }), blanco: mat("#f4f1ec", { roughness: 0.5 }),
    salvia: mat(C.salvia, { roughness: 1 }), salviaOsc: mat(C.salviaOsc, { roughness: 1, flatShading: true }),
    cesped: mat(C.cesped, { roughness: 1 }), terracota: mat(C.terracota, { roughness: 0.9 }), crema: mat(C.crema, { roughness: 0.6 }),
    tarima: mat("#ffffff", { map: texTarima, roughness: 0.55 }),
    listones: (rx, ry) => { const t = texListones.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return mat("#ffffff", { map: t, roughness: 0.7 }); },
    vidrio: new THREE.MeshPhysicalMaterial({ color: "#d9e2df", transparent: true, opacity: 0.12, roughness: 0.04, metalness: 0, depthWrite: false, envMapIntensity: 1.4 }),
    luz: new THREE.MeshStandardMaterial({ color: "#fff4e2", emissive: "#ffdcae", emissiveIntensity: 1.6 }),
  };

  // ───────── Ayudantes de construcción ─────────
  const grupoCasa = new THREE.Group(); scene.add(grupoCasa);
  // caja con base en y: centro (x, z), tamaño (w = x, h = y, d = z)
  function caja(w, h, d, x, y, z, m, padre = grupoCasa, r = 0) {
    const g = r > 0 ? new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2, h / 2, d / 2)) : new THREE.BoxGeometry(w, h, d);
    const o = new THREE.Mesh(g, m); o.position.set(x, y + h / 2, z); padre.add(o); return o;
  }
  // caja definida por rangos
  const cajaR = (x1, x2, y1, y2, z1, z2, m, r = 0, padre) => caja(x2 - x1, y2 - y1, z2 - z1, (x1 + x2) / 2, y1, (z1 + z2) / 2, m, padre, r);
  function cilindro(rt, rb, h, x, y, z, m, seg = 40, padre = grupoCasa) {
    const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m); o.position.set(x, y + h / 2, z); padre.add(o); return o;
  }
  function esfera(r, x, y, z, m, sx = 1, sy = 1, sz = 1, padre = grupoCasa) {
    const o = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 20), m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); padre.add(o); return o;
  }

  const ALTO = 3.3, GRUESO = 0.2;
  // Muro con huecos. eje "x": muro a z constante, de a a b en x. eje "z": muro a x constante, de a a b en z.
  // huecos: [{ a, b, y0, y1, ventana? }]
  function muro(eje, fijo, a, b, huecos = [], m = M.enlucido, desplazar = 0) {
    const pieza = (u1, u2, y1, y2) => {
      if (u2 - u1 < 0.001 || y2 - y1 < 0.001) return;
      if (eje === "x") cajaR(u1, u2, y1, y2, fijo - GRUESO / 2 + desplazar, fijo + GRUESO / 2 + desplazar, m);
      else cajaR(fijo - GRUESO / 2 + desplazar, fijo + GRUESO / 2 + desplazar, y1, y2, u1, u2, m);
    };
    let u = a;
    for (const h of [...huecos].sort((p, q) => p.a - q.a)) {
      pieza(u, h.a, 0, ALTO); pieza(h.a, h.b, 0, h.y0); pieza(h.a, h.b, h.y1, ALTO); u = h.b;
      if (h.ventana) ventana(eje, fijo + desplazar, h);
    }
    pieza(u, b, 0, ALTO);
  }
  // Marco negro fino + vidrio + montantes
  function ventana(eje, fijo, h) {
    const t = 0.05, prof = 0.08;
    const r = (u1, u2, y1, y2, mm, p = prof) => eje === "x" ? cajaR(u1, u2, y1, y2, fijo - p / 2, fijo + p / 2, mm) : cajaR(fijo - p / 2, fijo + p / 2, y1, y2, u1, u2, mm);
    r(h.a, h.b, h.y0, h.y0 + t, M.negro); r(h.a, h.b, h.y1 - t, h.y1, M.negro);
    r(h.a, h.a + t, h.y0, h.y1, M.negro); r(h.b - t, h.b, h.y0, h.y1, M.negro);
    const partes = h.partes || 1;
    for (let k = 1; k < partes; k++) { const u = mezclar(h.a, h.b, k / partes); r(u - t / 2, u + t / 2, h.y0, h.y1, M.negro); }
    const v = r(h.a, h.b, h.y0, h.y1, M.vidrio, 0.012); v.userData.vidrio = true;
  }

  // ───────── Cielo y terreno ─────────
  const cielo = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { arriba: { value: new THREE.Color("#c3d3da") }, horizonte: { value: new THREE.Color("#f6dfc6") }, sol: { value: new THREE.Color("#ffe9cf") } },
    vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: `uniform vec3 arriba, horizonte, sol; varying vec3 vP;
      void main(){ float h = clamp(vP.y * 2.2, 0.0, 1.0); vec3 c = mix(horizonte, arriba, pow(h, 0.7));
        float s = max(dot(normalize(vP), normalize(vec3(-0.6, 0.35, 0.72))), 0.0); c = mix(c, sol, pow(s, 8.0) * 0.6);
        gl_FragColor = vec4(c, 1.0); }`,
  }));
  scene.add(cielo);
  const suelo = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), M.cesped);
  suelo.rotation.x = -Math.PI / 2; suelo.position.y = -0.16; suelo.receiveShadow = true; scene.add(suelo);

  // Terraza de hormigón delante y caminito de losas
  cajaR(-9.2, 9.2, -0.3, 0.0, 0, 2.8, M.hormigon);
  for (let i = 0; i < 12; i++) {
    const z = 3.6 + i * 1.45, x = Math.sin(i * 0.55) * 0.35;
    cajaR(x - 0.65, x + 0.65, -0.2, -0.13, z - 0.36, z + 0.36, M.hormigon);
  }
  // Árbol minimalista: tronco fino y copa de esferas suaves
  function arbol(x, z, alto = 6, copa = 1.8, semilla = 1) {
    cilindro(0.09, 0.14, alto * 0.62, x, -0.16, z, M.negro, 12);
    const n = 5;
    for (let k = 0; k < n; k++) {
      const a = ruido(k, semilla) * Math.PI * 2, d = ruido(k, semilla + 3) * copa * 0.5;
      const r = copa * (0.55 + ruido(k, semilla + 7) * 0.35);
      esfera(r, x + Math.cos(a) * d, alto * 0.62 + copa * 0.55 + (ruido(k, semilla + 11) - 0.3) * copa * 0.7, z + Math.sin(a) * d, k % 2 ? M.salvia : M.salviaOsc, 1, 0.92, 1);
    }
  }
  arbol(-12.5, 7, 6.2, 2.0, 1); arbol(11.5, 4.5, 5.2, 1.7, 2); arbol(15, 12, 6.5, 2.1, 3); arbol(-17, 14, 7, 2.4, 4);
  // Jardín trasero (se ve desde el dormitorio)
  [[2, -21, 6.5, 2.2], [7.5, -24, 7.5, 2.6], [-3, -26, 7, 2.4], [12, -20, 5.5, 1.9], [-9, -22, 6, 2.1], [4.5, -32, 8, 2.8], [-14, -30, 7.5, 2.6], [16, -29, 7, 2.5]]
    .forEach(([x, z, a, c], k) => arbol(x, z, a, c, 20 + k));
  cajaR(-6, 14, -0.16, 0.7, -17.6, -16.9, M.salviaOsc, 0.25); // seto bajo
  cajaR(-1, 9, -0.16, 0.02, -17.2, -14.0, M.robleOsc);         // tarima exterior del dormitorio
  // Seto y jardineras delante
  cajaR(-8.8, -3.0, 0, 0.55, 2.15, 2.75, M.hormigon); esfera(0.42, -7.6, 0.75, 2.45, M.salvia, 1.4, 0.7, 0.8); esfera(0.4, -5.6, 0.72, 2.45, M.salviaOsc, 1.6, 0.6, 0.8); esfera(0.38, -3.9, 0.72, 2.45, M.salvia, 1.2, 0.7, 0.8);
  cajaR(3.0, 8.8, 0, 0.55, 2.15, 2.75, M.hormigon); esfera(0.42, 4.2, 0.75, 2.45, M.salviaOsc, 1.4, 0.7, 0.8); esfera(0.4, 6.1, 0.72, 2.45, M.salvia, 1.6, 0.6, 0.8); esfera(0.38, 7.8, 0.72, 2.45, M.salviaOsc, 1.2, 0.7, 0.8);

  // ───────── La casa ─────────
  // Suelo interior (tarima) y forjado
  const suelI = new THREE.Mesh(new THREE.PlaneGeometry(16, 14), M.tarima);
  suelI.rotation.x = -Math.PI / 2; suelI.position.set(0, 0.001, -7); grupoCasa.add(suelI);
  cajaR(-8.6, 8.6, ALTO, ALTO + 0.32, -14.5, 0.9, M.techo); // cubierta plana con vuelo
  cajaR(-8.62, 8.62, ALTO + 0.32, ALTO + 0.36, -14.52, 0.92, M.negro); // remate fino

  // Fachada principal (z = 0): ventanal izquierdo, puerta, ventanal derecho
  const PUERTA = { a: -0.6, b: 0.6, y0: 0, y1: 2.75 };
  muro("x", -0.1, -8, 8, [
    { a: -7.4, b: -2.6, y0: 0.2, y1: 3.0, ventana: true, partes: 3 },
    PUERTA,
    { a: 2.6, b: 7.2, y0: 0.2, y1: 3.0, ventana: true, partes: 3 },
  ]);
  // Revestimiento de listones de roble alrededor de la puerta
  const mListF = M.listones(3, 1);
  cajaR(-2.3, -0.6, 0, ALTO, -0.0, 0.07, mListF); cajaR(0.6, 2.3, 0, ALTO, -0.0, 0.07, mListF); cajaR(-0.6, 0.6, 2.75, ALTO, -0.0, 0.07, mListF);
  // Aplique exterior
  cajaR(1.0, 1.12, 2.0, 2.35, 0.07, 0.15, M.luz);
  // Puerta (bisagra en x = -0.6), se abre hacia dentro
  const puerta = new THREE.Group(); puerta.position.set(-0.6, 0, -0.06); grupoCasa.add(puerta);
  caja(1.2, 2.74, 0.06, 0.6, 0, 0, M.listones(1, 1), puerta);
  caja(0.03, 0.6, 0.05, 1.05, 0.85, 0.06, M.negro, puerta); // tirador

  // Laterales y fondo
  muro("z", -8 + 0.1, -14, 0);
  muro("z", 8 - 0.1, -14, 0);
  muro("x", -14 + 0.1, -8, 8, [{ a: 0.2, b: 7.4, y0: 0.12, y1: 3.0, ventana: true, partes: 3 }]);
  // Tabiques interiores: zona de día / dormitorio, y dormitorio / estudio
  muro("x", -8.5, -8, 8, [{ a: 2.4, b: 4.6, y0: 0, y1: 2.75 }]);
  muro("z", -1, -14, -8.5);

  // ───────── Salón ─────────
  // Alfombra
  cajaR(-6.6, -2.9, 0, 0.015, -5.6, -2.3, mat("#e9e1d4"), 0.005);
  // Sofá bajo de lino (mira hacia el ventanal)
  const sx = -4.75, sz = -4.85;
  cajaR(sx - 1.35, sx + 1.35, 0.06, 0.44, sz - 0.5, sz + 0.5, M.lino, 0.06);
  cajaR(sx - 1.35, sx + 1.35, 0.06, 0.88, sz - 0.5, sz - 0.24, M.lino, 0.1);
  cajaR(sx - 1.35, sx - 1.12, 0.06, 0.66, sz - 0.5, sz + 0.5, M.lino, 0.08);
  cajaR(sx + 1.12, sx + 1.35, 0.06, 0.66, sz - 0.5, sz + 0.5, M.lino, 0.08);
  cajaR(sx - 1.1, sx - 0.01, 0.44, 0.6, sz - 0.24, sz + 0.48, M.lino, 0.07);
  cajaR(sx + 0.01, sx + 1.1, 0.44, 0.6, sz - 0.24, sz + 0.48, M.lino, 0.07);
  caja(0.42, 0.42, 0.14, sx - 0.75, 0.58, sz - 0.14, M.salvia, grupoCasa, 0.06).rotation.set(-0.25, 0.15, 0);
  caja(0.4, 0.4, 0.14, sx + 0.8, 0.58, sz - 0.14, M.terracota, grupoCasa, 0.06).rotation.set(-0.25, -0.2, 0);
  // Mesa de centro redonda
  cilindro(0.58, 0.58, 0.05, sx, 0.36, -3.35, M.roble, 64); cilindro(0.26, 0.3, 0.36, sx, 0, -3.35, M.roble, 48);
  cilindro(0.09, 0.07, 0.18, sx + 0.15, 0.41, -3.25, M.crema); esfera(0.07, sx - 0.2, 0.44, -3.45, M.negro);
  cajaR(sx - 0.35, sx - 0.05, 0.41, 0.45, -3.2, -2.98, M.terracota);
  // Butaca
  const butaca = new THREE.Group(); butaca.position.set(-7.0, 0, -2.9); butaca.rotation.y = 1.1; grupoCasa.add(butaca);
  caja(0.85, 0.4, 0.8, 0, 0.08, 0, M.linoOsc, butaca, 0.08); caja(0.85, 0.5, 0.18, 0, 0.4, -0.34, M.linoOsc, butaca, 0.08);
  caja(0.16, 0.24, 0.8, -0.38, 0.4, 0, M.linoOsc, butaca, 0.07); caja(0.16, 0.24, 0.8, 0.38, 0.4, 0, M.linoOsc, butaca, 0.07);
  // Lámpara de pie
  cilindro(0.16, 0.16, 0.025, -7.3, 0, -5.4, M.negro); cilindro(0.012, 0.012, 1.45, -7.3, 0, -5.4, M.negro, 8);
  cilindro(0.17, 0.24, 0.32, -7.3, 1.42, -5.4, M.luz);
  // Planta grande junto a la ventana
  cilindro(0.3, 0.24, 0.55, -7.35, 0, -0.75, M.hormigon);
  for (let k = 0; k < 7; k++) esfera(0.32 + ruido(k, 30) * 0.15, -7.35 + (ruido(k, 31) - 0.5) * 0.7, 0.95 + k * 0.17, -0.75 + (ruido(k, 32) - 0.5) * 0.6, k % 2 ? M.salviaOsc : M.salvia, 1, 1.3, 1);
  // Estantería empotrada en la pared izquierda
  for (const y of [0.0, 0.85, 1.55, 2.25]) cajaR(-7.9, -7.55, y, y + (y === 0 ? 0.7 : 0.04), -3.6, -1.4, y === 0 ? M.blanco : M.roble);
  [[0.89, -3.2, 0.24, M.crema], [0.89, -2.7, 0.16, M.terracota], [1.59, -1.9, 0.3, M.crema], [2.29, -3.0, 0.2, M.negro]].forEach(([y, z, h, m]) => cilindro(0.07, 0.06, h, -7.72, y, z, m));
  for (let k = 0; k < 6; k++) cajaR(-7.86, -7.64, 1.59, 1.59 + 0.2 + ruido(k, 40) * 0.08, -3.4 + k * 0.05, -3.4 + k * 0.05 + 0.04, [M.crema, M.linoOsc, M.salvia][k % 3]);
  for (let k = 0; k < 5; k++) cajaR(-7.86, -7.64, 0.89, 0.89 + 0.22, -2.2 + k * 0.05, -2.2 + k * 0.05 + 0.04, [M.linoOsc, M.terracota, M.crema][k % 3]);

  // ───────── Comedor ─────────
  const dx = -4.0, dz = -7.15;
  cajaR(dx - 1.1, dx + 1.1, 0.71, 0.76, dz - 0.48, dz + 0.48, M.roble, 0.01);
  cajaR(dx - 0.95, dx - 0.87, 0, 0.71, dz - 0.38, dz + 0.38, M.roble); cajaR(dx + 0.87, dx + 0.95, 0, 0.71, dz - 0.38, dz + 0.38, M.roble);
  function silla(x, z, giro) {
    const s = new THREE.Group(); s.position.set(x, 0, z); s.rotation.y = giro; grupoCasa.add(s);
